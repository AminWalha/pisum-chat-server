<!-- PISUM Chat Widget — paste this before </body> in any HTML page -->
<style>
#pisum-chat-btn {
  position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px;
  background: linear-gradient(135deg, #00E5CC 0%, #7C3AED 100%);
  border-radius: 50%; border: none; cursor: pointer;
  box-shadow: 0 0 30px rgba(0, 229, 204, 0.25); z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s;
}
#pisum-chat-btn:hover {
  transform: translateY(-2px) scale(1.05);
  box-shadow: 0 0 40px rgba(0, 229, 204, 0.4);
}
#pisum-chat-btn svg { width: 24px; height: 24px; fill: #030408; }

#pisum-chat-box {
  position: fixed; bottom: 92px; right: 24px; width: 380px; max-width: calc(100vw - 32px);
  background: rgba(10, 12, 20, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 20px; box-shadow: 0 24px 64px rgba(0,0,0,0.6);
  border: 1px solid rgba(255, 255, 255, 0.12); z-index: 9999;
  display: none; flex-direction: column; overflow: hidden;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  animation: pisumWidgetIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes pisumWidgetIn {
  from { opacity: 0; transform: translateY(12px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

#pisum-chat-header {
  background: rgba(0, 0, 0, 0.35); padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.pisum-head-left { display: flex; align-items: center; gap: 10px; }
.pisum-head-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, #00E5CC 0%, #7C3AED 100%);
  display: flex; align-items: center; justify-content: center; font-size: 0.9rem;
}
.pisum-head-title { font-size: 0.88rem; font-weight: 700; color: #FFFFFF; line-height: 1.2; }
.pisum-head-sub { font-size: 0.68rem; color: #10B981; display: flex; align-items: center; gap: 4px; }
.pisum-dot-live { width: 5px; height: 5px; border-radius: 50%; background: #10B981; }

#pisum-chat-close {
  background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08);
  color: #94A3B8; cursor: pointer; font-size: 1rem; width: 28px; height: 28px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
#pisum-chat-close:hover { color: #FFFFFF; background: rgba(255, 255, 255, 0.12); }

#pisum-chat-messages {
  height: 340px; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
  background: transparent; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
}
.pisum-msg { max-width: 86%; padding: 10px 14px; border-radius: 14px; font-size: 0.82rem; line-height: 1.6; word-break: break-word; }
.pisum-msg.bot {
  background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08);
  color: #E2E8F0; align-self: flex-start; border-bottom-left-radius: 4px;
}
.pisum-msg.bot strong { color: #00E5CC; font-weight: 600; }
.pisum-msg.bot ul, .pisum-msg.bot ol { margin: 6px 0 6px 16px; padding: 0; }
.pisum-msg.bot li { margin-bottom: 4px; }
.pisum-msg.user {
  background: linear-gradient(135deg, #00E5CC 0%, #7C3AED 100%);
  color: #030408; font-weight: 600; align-self: flex-end; border-bottom-right-radius: 4px;
}
.pisum-typing { display: inline-flex; gap: 4px; align-items: center; padding: 10px 14px; }
.pisum-typing span {
  width: 5px; height: 5px; border-radius: 50%; background: #94A3B8;
  animation: pisumBounce 0.9s infinite;
}
.pisum-typing span:nth-child(2) { animation-delay: 0.15s; }
.pisum-typing span:nth-child(3) { animation-delay: 0.3s; }
@keyframes pisumBounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }

#pisum-chat-input-row {
  display: flex; padding: 12px; gap: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.08); background: rgba(0, 0, 0, 0.35);
  align-items: center;
}
#pisum-chat-input {
  flex: 1; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 999px;
  padding: 8px 14px; font-size: 0.82rem; font-family: inherit;
  background: rgba(255, 255, 255, 0.04); color: #FFFFFF; outline: none;
  transition: border-color 0.2s;
}
#pisum-chat-input:focus { border-color: #00E5CC; }
#pisum-chat-input::placeholder { color: #64748B; }
#pisum-chat-send {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, #00E5CC 0%, #7C3AED 100%);
  color: #030408; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.18s, opacity 0.18s; flex-shrink: 0;
}
#pisum-chat-send:hover { transform: scale(1.06); }
#pisum-chat-send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
#pisum-chat-send svg { width: 14px; height: 14px; fill: currentColor; }
</style>

<!-- Chat button -->
<button id="pisum-chat-btn" onclick="pisumToggleChat()" title="Chat with PISUM AI">
  <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
</button>

<!-- Chat box -->
<div id="pisum-chat-box">
  <div id="pisum-chat-header">
    <div class="pisum-head-left">
      <div class="pisum-head-avatar">✨</div>
      <div>
        <div class="pisum-head-title">PISUM Assistant</div>
        <div class="pisum-head-sub"><span class="pisum-dot-live"></span> Online · Clinical Synthesis</div>
      </div>
    </div>
    <button id="pisum-chat-close" onclick="pisumToggleChat()" aria-label="Close chat">✕</button>
  </div>
  <div id="pisum-chat-messages">
    <div class="pisum-msg bot">Hi! I am the <strong>PISUM</strong> assistant 👋<br>Ask me about clinical synthesis, 112 templates, offline security, RIS/PACS integration, or practice tiers.</div>
  </div>
  <div id="pisum-chat-input-row">
    <input id="pisum-chat-input" placeholder="Ask about clinical workflows, setup, or pricing…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();pisumSend()}"/>
    <button id="pisum-chat-send" onclick="pisumSend()" aria-label="Send message">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
const PISUM_CHAT_URL = 'https://pisum-chat-server.onrender.com';
const pisumSessionId = 'sess_' + Math.random().toString(36).slice(2);

function pisumToggleChat() {
  const box = document.getElementById('pisum-chat-box');
  const isOpen = box.style.display === 'flex';
  box.style.display = isOpen ? 'none' : 'flex';
  if (!isOpen) document.getElementById('pisum-chat-input').focus();
}

function pisumFormatMarkdown(text) {
  let html = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^\s*[-•*]\s+(.*)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
  html = html.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
  return html;
}

function pisumAddMsg(content, type) {
  const msgs = document.getElementById('pisum-chat-messages');
  const div = document.createElement('div');
  div.className = 'pisum-msg ' + type;
  if (type === 'user') {
    div.textContent = content;
  } else {
    div.innerHTML = pisumFormatMarkdown(content);
  }
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

async function pisumSend() {
  const input = document.getElementById('pisum-chat-input');
  const btn = document.getElementById('pisum-chat-send');
  const message = input.value.trim();
  if (!message) return;

  pisumAddMsg(message, 'user');
  input.value = '';
  btn.disabled = true;

  const msgs = document.getElementById('pisum-chat-messages');
  const typingDiv = document.createElement('div');
  typingDiv.className = 'pisum-msg bot pisum-typing';
  typingDiv.innerHTML = '<span></span><span></span><span></span>';
  msgs.appendChild(typingDiv);
  msgs.scrollTop = msgs.scrollHeight;

  try {
    const res = await fetch(PISUM_CHAT_URL + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, sessionId: pisumSessionId }),
    });
    const data = await res.json();
    typingDiv.remove();
    pisumAddMsg(data.reply || data.error || 'No response.', 'bot');
  } catch {
    typingDiv.remove();
    pisumAddMsg('Connection error. Please try again.', 'bot');
  }

  btn.disabled = false;
  input.focus();
}
</script>
